<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingBook 会议助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #4f6ef7; --primary-dark: #3d56d8; --bg: #f4f6fb;
    --card: #fff; --border: #e3e8f2; --text: #24292f; --muted: #6b7280;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  }
  body { font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 20px; color: var(--primary); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; }
  .badge.ok { background: #e8f7ee; color: var(--ok); }
  .badge.warn { background: #fdf3e3; color: var(--warn); }
  .btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.danger { color: var(--err); border-color: #f3c6c6; }
  .btn.danger:hover { background: #fef2f2; border-color: var(--err); }

  #taskBar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 10px 24px;
  }
  #taskBar.hidden { display: none; }
  .task-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .task-info { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }
  .task-pct { font-size: 14px; font-weight: 700; color: var(--primary); white-space: nowrap; }
  .progress { flex: 1; height: 8px; background: #eef1f8; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4f6ef7, #7b93f9); border-radius: 4px; transition: width .4s; }
  .task-live {
    margin-top: 8px; max-height: 96px; overflow-y: auto;
    font-size: 12px; color: #4a5568; line-height: 1.7;
    border-left: 2px solid #dbe3f5; padding-left: 12px; background: #fbfcff; border-radius: 0 6px 6px 0;
  }
  .task-live.hidden { display: none; }
  .task-live .live-line { margin: 2px 0; }
  .task-live .live-line .ts { color: var(--primary); margin-right: 8px; font-family: Consolas, monospace; }

  /* 音频卡片内联转写状态与进度 */
  .media-state { font-size: 12px; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
  .media-state.idle { background: #eef1f8; color: var(--muted); }
  .media-state.ok { background: #e8f7ee; color: var(--ok); }
  .media-state.running { background: #eaf0fe; color: var(--primary); }
  .media-progress { margin-top: 10px; }
  .media-progress .progress { height: 6px; }
  .media-live {
    margin-top: 6px; font-size: 12px; color: var(--primary-dark); line-height: 1.6;
    background: #f5f8ff; border-radius: 6px; padding: 6px 10px; min-height: 20px;
  }
  .media-live::before { content: "正在识别："; color: var(--muted); }

  main { display: grid; grid-template-columns: 280px 1fr 340px; gap: 16px; padding: 16px 24px; align-items: start; }
  aside, section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  aside { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow-y: auto; }
  aside .btn { width: 100%; margin-bottom: 12px; }
  #meetingList { list-style: none; }
  #meetingList li {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
    border: 1px solid transparent;
  }
  #meetingList li:hover { background: #f0f3fb; }
  #meetingList li.active { background: #eaf0fe; border-color: var(--primary); }
  .m-date { font-size: 12px; color: var(--primary); font-weight: 600; }
  .m-topic { font-size: 14px; margin: 2px 0; }
  .m-counts { font-size: 12px; color: var(--muted); }

  #detail h2 { font-size: 18px; margin-bottom: 12px; }
  #detailEmpty { color: var(--muted); text-align: center; padding: 60px 0; }
  .actions { display: flex; gap: 10px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tab { border: none; background: none; padding: 8px 14px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .item-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .item-card .name { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .item-card audio { width: 100%; margin-top: 6px; }
  .item-card pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.7; font-family: inherit; color: #374151; max-height: 400px; overflow-y: auto; }
  .agenda-card { background: #fbfcff; border-left: 3px solid var(--primary); }
  .detail-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 12px; }
  .meta-item { font-size: 12px; color: var(--muted); background: #f0f3fb; padding: 3px 10px; border-radius: 14px; }

  /* 议程卡片 */
  .agenda-head { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 10px; font-size: 13px; }
  .agenda-item b { color: var(--muted); font-weight: 500; margin-right: 4px; }
  .agenda-item i.unset { color: #c3c9d6; font-style: normal; font-size: 12px; }
  .agenda-sec { margin-top: 8px; }
  .agenda-sec-title { font-size: 13px; font-weight: 600; color: #1f2937; margin-bottom: 4px; border-left: 3px solid var(--primary); padding-left: 8px; }
  .md-body .unset { color: #c3c9d6; font-size: 12px; }
  .modal textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; outline: none; }
  .modal textarea:focus { border-color: var(--primary); }
  .empty-tip { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  /* ---- Markdown 内容样式 ---- */
  .md-body { font-size: 13.5px; line-height: 1.85; color: #374151; }
  .md-body h1, .md-body h2, .md-body h3, .md-body h4 {
    margin: 18px 0 8px; line-height: 1.4; color: #1f2937;
  }
  .md-body h1 { font-size: 19px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .md-body h2 { font-size: 17px; padding-left: 10px; border-left: 4px solid var(--primary); }
  .md-body h3 { font-size: 15px; }
  .md-body h4 { font-size: 14px; color: var(--primary-dark); }
  .md-body p { margin: 8px 0; }
  .md-body ul, .md-body ol { margin: 8px 0; padding-left: 24px; }
  .md-body li { margin: 3px 0; }
  .md-body table {
    border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px;
  }
  .md-body th, .md-body td {
    border: 1px solid #d9e0ee; padding: 8px 12px; text-align: left; vertical-align: top;
  }
  .md-body th { background: #f0f4fd; color: #1f2937; font-weight: 600; white-space: nowrap; }
  .md-body tbody tr:nth-child(even) td { background: #fafbfe; }
  .md-body tbody tr:hover td { background: #f2f6ff; }
  .md-body blockquote {
    border-left: 3px solid var(--primary); background: #f5f8ff; color: #4a5568;
    margin: 10px 0; padding: 8px 14px; border-radius: 0 8px 8px 0;
  }
  .md-body code {
    background: #eef1f8; color: #c0392b; padding: 1px 6px; border-radius: 4px;
    font-size: 12px; font-family: Consolas, "Courier New", monospace;
  }
  .md-body pre {
    background: #1e2430; color: #e6e9f0; padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; margin: 12px 0;
  }
  .md-body pre code { background: none; color: inherit; padding: 0; }
  .md-body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .md-body ul.todo-list { list-style: none; padding-left: 4px; }
  .md-body .todo-box { display: inline-block; margin-right: 6px; color: var(--primary); }
  .md-body .todo-done { color: var(--muted); text-decoration: line-through; }
  .md-body .todo-open { color: inherit; }


  #qa h2 { font-size: 16px; margin-bottom: 12px; }
  .qa-input { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .qa-input input, .qa-input select {
    padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none;
  }
  .qa-input input:focus { border-color: var(--primary); }
  #qaResult { font-size: 13px; }
  .hit { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .hit .src { font-size: 12px; color: var(--primary); margin-bottom: 4px; }
  .hit .txt { color: #374151; line-height: 1.6; }
  .answer { background: #f0f6ff; border: 1px solid #cfe0ff; border-radius: 8px; padding: 12px; margin-bottom: 12px; line-height: 1.7; white-space: pre-wrap; }
  .qa-loading { color: var(--muted); padding: 12px 0; }

  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; }
  .modal h3 { margin-bottom: 14px; }
  .modal .row { margin-bottom: 12px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .modal input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .modal .row-btns { display: flex; gap: 10px; justify-content: flex-end; }
  .modal .note { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .err { color: var(--err); font-size: 13px; margin-top: 6px; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } aside { position: static; } }
</style>
</head>
<body>
<header>
  <h1>📖 MeetingBook 会议助手</h1>
  <div class="header-right">
    <span id="keyBadge" class="badge warn">Key 未配置</span>
    <button class="btn" onclick="openKeyModal()">⚙️ 设置</button>
  </div>
</header>

<div id="taskBar" class="hidden">
  <div class="task-head">
    <div class="task-info" id="taskInfo">—</div>
    <div class="task-pct" id="taskPct"></div>
  </div>
  <div class="progress"><div class="progress-fill" id="taskProgress"></div></div>
  <div class="task-live" id="taskLive"></div>
</div>

<main>
  <aside>
    <button class="btn primary" onclick="openImportModal()">＋ 导入音频</button>
    <ul id="meetingList"></ul>
  </aside>

  <section id="detail">
    <div id="detailEmpty">从左侧选择一个会议</div>
    <div id="detailContent" style="display:none">
      <h2 id="detailTitle"></h2>
      <div id="detailMeta" class="detail-meta"></div>
      <div id="detailAgenda" class="item-card agenda-card" style="display:none">
        <div class="name">
          <span id="agendaTitle">📋 议程</span>
          <span style="display:flex;align-items:center;gap:8px">
            <button class="btn" onclick="fillAgendaFromTranscript()" style="padding:3px 10px;font-size:12px">✨ 从转写填充</button>
            <button class="btn" onclick="openAgendaModal()" style="padding:3px 10px;font-size:12px">✏️ 编辑议程</button>
          </span>
        </div>
        <div class="agenda-head" id="agendaHead"></div>
        <div class="agenda-sec"><div class="agenda-sec-title">议题</div><div id="agendaTopics" class="md-body"></div></div>
        <div class="agenda-sec"><div class="agenda-sec-title">备注</div><div id="agendaNotes" class="md-body"></div></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="btnTranscribe" onclick="startTranscribe()">转写音频</button>
        <button class="btn" id="btnSummarize" onclick="startSummarize()">生成纪要</button>
        <button class="btn" onclick="openPropsModal()">编辑属性</button>
        <button class="btn" onclick="refreshDetail()">刷新</button>
        <button class="btn danger" onclick="confirmDeleteMeeting()">删除会议</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="audio" onclick="switchTab('audio')">音频</button>
        <button class="tab" data-tab="transcripts" onclick="switchTab('transcripts')">转写</button>
        <button class="tab" data-tab="notes" onclick="switchTab('notes')">纪要</button>
      </div>
      <div id="tab-audio" class="tab-panel active"></div>
      <div id="tab-transcripts" class="tab-panel"></div>
      <div id="tab-notes" class="tab-panel"></div>
    </div>
  </section>

  <section id="qa">
    <h2>🔍 检索提问</h2>
    <div class="qa-input">
      <input id="qaQuery" placeholder="输入问题或关键词，如：预算 / 上周决定了什么？" onkeydown="if(event.key==='Enter')doQA()">
      <select id="qaMode">
        <option value="ask">LLM 问答（推荐）</option>
        <option value="search">关键词检索</option>
      </select>
      <button class="btn primary" onclick="doQA()">提交</button>
    </div>
    <div id="qaResult"></div>
  </section>
</main>

<!-- 导入模态框 -->
<div class="modal-mask" id="importModal">
  <div class="modal">
    <h3>导入音频</h3>
    <div class="row"><label>音频/视频文件</label><input type="file" id="importFile" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,.amr,.3gp,.mp4,.mkv,.webm,.mov,.avi,.flv,.ts,.m2ts,.wmv"></div>
    <div class="row"><label>会议主题（留空用文件名）</label><input type="text" id="importTopic" placeholder="如：产品评审"></div>
    <div class="row"><label>会议日期（留空今天）</label><input type="date" id="importDate"></div>
    <div class="err" id="importErr"></div>
    <div class="row-btns">
      <button class="btn" onclick="closeModal('importModal')">取消</button>
      <button class="btn primary" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<!-- 议程编辑弹窗 -->
<div class="modal-mask" id="agendaModal">
  <div class="modal" style="width:520px">
    <h3>编辑议程</h3>
    <div class="row"><label>会议名称</label><input type="text" id="a_title"></div>
    <div class="row"><label>时间（如 14:00）</label><input type="text" id="a_time"></div>
    <div class="row"><label>地点</label><input type="text" id="a_location"></div>
    <div class="row"><label>主持人</label><input type="text" id="a_organizer"></div>
    <div class="row"><label>参会人（逗号分隔）</label><input type="text" id="a_participants"></div>
    <div class="row"><label>议题（每行一条）</label><textarea id="a_topics" rows="5" placeholder="1. 议题一&#10;2. 议题二"></textarea></div>
    <div class="row"><label>备注</label><textarea id="a_notes" rows="3"></textarea></div>
    <div class="err" id="agendaErr"></div>
    <div class="row-btns">
      <button class="btn" onclick="closeModal('agendaModal')">取消</button>
      <button class="btn primary" onclick="saveAgenda()">保存</button>
    </div>
  </div>
</div>

<!-- 会议属性编辑弹窗 -->
<div class="modal-mask" id="propsModal">
  <div class="modal">
    <h3>编辑会议属性</h3>
    <div class="row"><label>名称</label><input type="text" id="p_name"></div>
    <div class="row"><label>时间（如 14:00）</label><input type="text" id="p_time" placeholder="14:00"></div>
    <div class="row"><label>地点</label><input type="text" id="p_location" placeholder="3F 会议室"></div>
    <div class="row"><label>主持人</label><input type="text" id="p_organizer"></div>
    <div class="row"><label>参会人（逗号分隔）</label><input type="text" id="p_participants" placeholder="张三, 李四"></div>
    <div class="err" id="propsErr"></div>
    <div class="row-btns">
      <button class="btn" onclick="autoFillFromTranscript()">从转写自动填充</button>
      <button class="btn primary" onclick="saveProps()">保存</button>
    </div>
    <div class="note">「从转写自动填充」：AI 根据转写文本提取时间/地点/主持人/参会人（需已转写）。保存到 meeting.properties。</div>
  </div>
</div>

<!-- API Key 模态框 -->
<div class="modal-mask" id="keyModal">
  <div class="modal">
    <h3>DeepSeek API Key</h3>
    <div class="row"><label>当前状态</label><div id="keyStatus" style="font-size:14px">…</div></div>
    <div class="row"><label>DeepSeek API Key（sk-…）</label><input type="password" id="keyInput" placeholder="粘贴 Key"></div>
    <div class="err" id="keyErr"></div>
    <div class="row-btns">
      <button class="btn" onclick="clearKey()">清除 Key</button>
      <button class="btn primary" onclick="saveKey()">保存 Key</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">
    <div class="row"><label>会议数据目录（可放项目外/自定义名称，支持中文与相对路径）</label><input type="text" id="dirInput" placeholder="如 D:\会议数据 或 会议数据"></div>
    <div class="row"><label>当前目录</label><div id="dirStatus" style="font-size:12px;color:var(--muted);word-break:break-all">…</div></div>
    <div class="err" id="dirErr"></div>
    <div class="row-btns">
      <button class="btn primary" onclick="saveDir()">保存目录</button>
      <button class="btn" onclick="closeModal('keyModal')">关闭</button>
    </div>
    <div class="note">Key 存 `.env` 不入库；切换数据目录后立即生效并持久化，会议列表会刷新。</div>
  </div>
</div>

<script>
"use strict";
let meetings = [];
let currentMeeting = null;
let activeTask = null;
let mediaIdx = {};  // 音频文件名 -> 详情卡片序号（转写进度内联更新用）

const $ = id => document.getElementById(id);

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok && !data.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

/* ---------- 会议列表与详情 ---------- */
async function loadMeetings() {
  meetings = await api("/api/meetings");
  const ul = $("meetingList");
  ul.innerHTML = "";
  if (!meetings.length) { ul.innerHTML = '<li class="empty-tip">还没有会议，先导入音频</li>'; return; }
  meetings.forEach(m => {
    const li = document.createElement("li");
    li.dataset.name = m.name;
    li.innerHTML = `<div class="m-date">${m.date}</div><div class="m-topic">${escapeHtml(m.title)}</div>
      <div class="m-counts">音频 ${m.audio} · 转写 ${m.transcripts} · 纪要 ${m.notes}</div>`;
    li.onclick = () => selectMeeting(m.name, li);
    ul.appendChild(li);
  });
  if (currentMeeting) {
    const li = ul.querySelector(`li[data-name="${CSS.escape(currentMeeting)}"]`);
    if (li) li.classList.add("active");
  }
}

async function selectMeeting(name, li) {
  currentMeeting = name;
  document.querySelectorAll("#meetingList li").forEach(x => x.classList.remove("active"));
  if (li) li.classList.add("active");
  await refreshDetail();
}

async function refreshDetail() {
  if (!currentMeeting) return;
  const d = await api("/api/meeting/" + encodeURIComponent(currentMeeting));
  $("detailEmpty").style.display = "none";
  $("detailContent").style.display = "block";
  $("detailTitle").textContent = d.date + " · " + d.title;

  // 属性 meta 行（时间/地点/主持人/参会人）
  const p = d.props || {};
  const metas = [];
  if (p.time) metas.push("🕐 " + p.time);
  if (p.location) metas.push("📍 " + p.location);
  if (p.organizer) metas.push("👤 主持人：" + p.organizer);
  if (p.participants) metas.push("👥 " + p.participants);
  $("detailMeta").innerHTML = metas.length
    ? metas.map(m => `<span class="meta-item">${escapeHtml(m)}</span>`).join("")
    : "";

  // 议程卡片（智能填充：头部用属性，议题/备注来自 agenda.md）
  $("detailAgenda").style.display = "block";
  renderAgenda(d);

  // 音频/视频卡片：含转写状态徽章 + 内联进度条 + 实时识别文本
  const tDone = new Set(d.transcripts.map(t => t.name.replace(/-转写\.txt$/, "")));
  mediaIdx = {};
  $("tab-audio").innerHTML = d.audio.length ? d.audio.map((a, i) => {
    mediaIdx[a.name] = i;
    const base = a.name.replace(/\.[^.]+$/, "");
    const done = tDone.has(base);
    return `<div class="item-card">
      <div class="name">
        <span>${escapeHtml(a.name)}</span>
        <span style="display:flex;align-items:center;gap:8px">

/* ---------- 议程卡片（智能填充 + 编辑） ---------- */
function parseAgenda(txt) {
  // 从 agenda.md 提取 议题/备注 部分（兼容新模板与旧模板）
  const t = txt || "";
  const m1 = t.match(/##\s*议题\s*\n([\s\S]*?)(?=\n##|\s*$)/);
  const m2 = t.match(/##\s*备注\s*\n([\s\S]*)$/);
  return {
    topics: (m1 ? m1[1] : "").trim(),
    notes: (m2 ? m2[1] : "").trim()
  };
}
function renderAgenda(d) {
  const p = d.props || {};
  const title = (p.name || (d.title || "")).trim();
  $("agendaTitle").textContent = "📋 " + (title || "会议") + " 议程";

  // 头部：智能填充（属性有值显示，无值灰显“未设置”）
  const head = [];
  const row = (label, v) => `<span class="agenda-item"><b>${label}</b>${v ? escapeHtml(v) : '<i class="unset">未设置</i>'}</span>`;
  head.push(row("日期", p.date || d.date));
  head.push(row("时间", p.time));
  head.push(row("参会人", p.participants));
  head.push(row("地点", p.location));
  if (p.organizer) head.push(row("主持人", p.organizer));
  $("agendaHead").innerHTML = head.join("");

  // 议题/备注
  const ag = parseAgenda(d.agenda);
  $("agendaTopics").innerHTML = ag.topics ? renderMd(ag.topics) : '<span class="unset">（未设置议题，点「编辑议程」添加）</span>';
  $("agendaNotes").innerHTML = ag.notes ? renderMd(ag.notes) : '<span class="unset">（无备注）</span>';
}

function startTask(name, body, label) {
  $("taskBar").classList.remove("hidden");
  setTask(label, 0);
  api("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(d => pollTask(d.task))
    .catch(e => { setTask("失败: " + e.message, 0); setTimeout(hideTask, 3000); });
}
function pollTask(tid) {
  const t = setInterval(async () => {
    try {
      const d = await api("/api/task/" + tid);
      renderTask(d);
      if (d.status === "done") {
        clearInterval(t); setTimeout(hideTask, 600);
        await loadMeetings(); if (currentMeeting) await refreshDetail();
      } else if (d.status === "error") {
        clearInterval(t); setTask("失败: " + (d.error || "未知错误"), 100);
        setTimeout(hideTask, 5000);
      }
    } catch (e) { clearInterval(t); setTask("任务异常: " + e.message, 0); }
  }, 1000);
}
function renderTask(d) {
  const info = d.info || {};
  let pct = 0, text = stageText(d.stage, info), live = null;
  if (d.stage === "transcribing") {
    if (info.pct != null && info.total) {
      // 总进度 = (已完成文件 + 当前文件内进度) / 总数
      pct = Math.round(((info.index - 1) + info.pct / 100) / info.total * 100);
      text = `转写 ${info.file}（${info.index}/${info.total}）· 本音频 ${info.pct}%`;
    } else if (info.pct != null) {
      pct = info.pct;
      text = `转写 ${info.file} · ${info.pct}%`;
    } else if (info.total) {
      pct = Math.round(info.index / info.total * 100);
    }
    live = info.live || [];
    updateMediaProgress(info);  // 内联更新对应音频卡片
  } else if (d.stage === "summarizing" && info.total) {
    pct = Math.round(info.index / info.total * 100);
  }
  if (d.stage === "done") pct = 100;
  if (d.status === "error") { pct = 100; text = "错误"; }
  setTask(text, pct, live);
}
function updateMediaProgress(info) {
  const f = info.file;
  if (!f || !(f in mediaIdx)) return;
  const i = mediaIdx[f];
  const st = $("state-" + i), pg = $("prog-" + i), fill = $("progfill-" + i), lt = $("livetxt-" + i);
  if (!st || !pg) return;
  const pct = info.pct != null ? info.pct : 0;
  st.textContent = "转写中 " + pct + "%";
  st.className = "media-state running";
  pg.classList.remove("hidden");
  if (fill) fill.style.width = pct + "%";
  if (lt) {
    const last = (info.live && info.live.length)
      ? info.live[info.live.length - 1].replace(/^\[[^\]]*\]\s*/, "")
      : (info.text || "正在识别…");
    lt.textContent = last;
  }
}
function stageText(s, info) {
  const i = info || {};
  switch (s) {
    case "model_start": return "加载 Whisper 模型…";
    case "model_ready": return "模型就绪，开始转写";
    case "transcribing": return `转写 ${i.file || ""} (${i.index}/${i.total})`;
    case "summarizing": return `摘要 ${i.file || ""} (${i.index}/${i.total})`;
    case "searching": return `检索到 ${i.hits || 0} 条相关片段`;
    case "llm": return "DeepSeek 生成回答中…";
    case "autofilling": return "从转写提取会议属性…";
    case "agenda_llm": return "AI 生成议程（议题/备注）…";
    default: return s || "…";
  }
}
function setTask(text, pct, live) {
  $("taskInfo").textContent = text;
  $("taskProgress").style.width = pct + "%";
  $("taskPct").textContent = pct + "%";
  const liveEl = $("taskLive");
  if (live && live.length) {
    liveEl.classList.remove("hidden");
    liveEl.innerHTML = live.slice(-15).map(l => {
      const m = l.match(/^\[([^\]]*)\]\s*(.*)$/);
      return m
        ? `<div class="live-line"><span class="ts">${escapeHtml(m[1])}</span>${escapeHtml(m[2])}</div>`
        : `<div class="live-line">${escapeHtml(l)}</div>`;
    }).join("");
    liveEl.scrollTop = liveEl.scrollHeight;
  } else if (live) {
    liveEl.classList.remove("hidden");
    liveEl.innerHTML = '<div class="live-line">正在识别…</div>';
  } else {
    liveEl.classList.add("hidden");
  }
}
function hideTask() { $("taskBar").classList.add("hidden"); $("taskLive").classList.add("hidden"); }

/* ---------- Markdown 渲染（增强版：表格/列表/引用/代码块/待办/标题/段落） ---------- */
function renderMd(src) {
  const lines = String(src || "").replace(/\r\n/g, "\n").split("\n");
  const html = [];
  let i = 0;

  // 行内元素：代码 -> 粗体 -> 斜体
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  }
  // 表格行解析
  function parseRow(r) {
    return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  }

  while (i < lines.length) {
    const t = lines[i].trim();

    if (!t) { i++; continue; }

    // 代码块
    if (t.startsWith("```")) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) { buf.push(lines[i]); i++; }
      i++; // 跳过结尾 ```
      html.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
      continue;
    }

    // 表格（下一行是分隔行 |---|---|）
    if (t.startsWith("|") && /^\|[\s:|-]+\|$/.test(lines[i + 1]?.trim() || "")) {
      const head = parseRow(t);
      const rows = [];
      i += 2; // 跳过表头与分隔行
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        rows.push(parseRow(lines[i]));
        i++;
      }
      html.push(`<table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead>` +
                `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }

    // 标题
    const hm = t.match(/^(#{1,4})\s+(.+)$/);
    if (hm) {
      const lv = hm[1].length;
      html.push(`<h${lv}>${inline(hm[2])}</h${lv}>`);
      i++;
      continue;
    }

    // 引用
    if (t.startsWith(">")) {
      const qs = [];
      while (i < lines.length && lines[i].trim().startsWith(">")) {
        qs.push(inline(lines[i].trim().replace(/^>\s?/, "")));
        i++;
      }
      html.push(`<blockquote>${qs.join("<br>")}</blockquote>`);
      continue;
    }

    // 水平线
    if (/^(-{3,}|\*{3,})$/.test(t)) { html.push("<hr>"); i++; continue; }

    // 待办事项 - [ ] / - [x]
    const tm = t.match(/^[-*+]\s+\[([ xX])\]\s+(.+)$/);
    if (tm) {
      const items = [];
      while (i < lines.length) {
        const m = lines[i].trim().match(/^[-*+]\s+\[([ xX])\]\s+(.+)$/);
        if (!m) break;
        const done = m[1].toLowerCase() === "x";
        items.push(`<li class="${done ? "todo-done" : "todo-open"}"><span class="todo-box">${done ? "☑" : "☐"}</span>${inline(m[2])}</li>`);
        i++;
      }
      html.push(`<ul class="todo-list">${items.join("")}</ul>`);
      continue;
    }

    // 无序列表（连续项）
    if (/^[-*+]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) {
        items.push(inline(lines[i].trim().replace(/^[-*+]\s+/, "")));
        i++;
      }
      html.push(`<ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>`);
      continue;
    }

    // 有序列表（连续项）
    if (/^\d+[.)]\s+/.test(t)) {
      const items = [];
      while (i < lines.length && /^\d+[.)]\s+/.test(lines[i].trim())) {
        items.push(inline(lines[i].trim().replace(/^\d+[.)]\s+/, "")));
        i++;
      }
      html.push(`<ol>${items.map(x => `<li>${x}</li>`).join("")}</ol>`);
      continue;
    }

    // 段落（连续非空行，空行内用 <br>）
    const paras = [];
    while (i < lines.length && lines[i].trim()) {
      paras.push(inline(lines[i]));
      i++;
    }
    html.push(`<p>${paras.join("<br>")}</p>`);
  }
  return html.join("");
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
